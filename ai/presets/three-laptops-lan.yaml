# LAN: set JUDGE_N_URL to each laptop. Unset URLs use the main OLLAMA_URL.
panel:
  quorum: ${JUDGES_QUORUM}
  execution: ${JUDGES_EXECUTION:-auto}
  host_concurrency: ${JUDGES_HOST_CONCURRENCY:-1}
  timeout_seconds: ${JUDGES_TIMEOUT_SECONDS:-540}
  judge_timeout_seconds: ${JUDGE_TIMEOUT_SECONDS:-240}
  keep_alive: ${JUDGES_KEEP_ALIVE:-30m}

judges:
  - name: judge-1
    provider: ${JUDGE_1_PROVIDER:-ollama}
    model: ${JUDGE_1_MODEL:-qwen3:4b}
    url: ${JUDGE_1_URL}
    fallback_url: ${JUDGE_1_FALLBACK_URL}
    fallback_model: ${JUDGE_1_FALLBACK_MODEL}
    api_key_env: ${JUDGE_1_API_KEY_ENV}
    temperature: ${JUDGE_1_TEMPERATURE}
    keep_alive: ${JUDGE_1_KEEP_ALIVE}
  - name: judge-2
    provider: ${JUDGE_2_PROVIDER:-ollama}
    model: ${JUDGE_2_MODEL:-gemma3:4b}
    url: ${JUDGE_2_URL}
    fallback_url: ${JUDGE_2_FALLBACK_URL}
    fallback_model: ${JUDGE_2_FALLBACK_MODEL}
    api_key_env: ${JUDGE_2_API_KEY_ENV}
    temperature: ${JUDGE_2_TEMPERATURE}
    keep_alive: ${JUDGE_2_KEEP_ALIVE}
  - name: judge-3
    provider: ${JUDGE_3_PROVIDER:-ollama}
    model: ${JUDGE_3_MODEL:-llama3.2:3b}
    url: ${JUDGE_3_URL}
    fallback_url: ${JUDGE_3_FALLBACK_URL}
    fallback_model: ${JUDGE_3_FALLBACK_MODEL}
    api_key_env: ${JUDGE_3_API_KEY_ENV}
    temperature: ${JUDGE_3_TEMPERATURE}
    keep_alive: ${JUDGE_3_KEEP_ALIVE}
