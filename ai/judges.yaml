# The default panel uses OpenAI. Set OPENAI_API_KEY in the evaluator's environment.
panel:
  quorum: ${JUDGES_QUORUM}
  execution: ${JUDGES_EXECUTION:-auto}
  host_concurrency: ${JUDGES_HOST_CONCURRENCY:-1}
  timeout_seconds: ${JUDGES_TIMEOUT_SECONDS:-540}
  judge_timeout_seconds: ${JUDGE_TIMEOUT_SECONDS:-240}
  keep_alive: ${JUDGES_KEEP_ALIVE:-30m}

judges:
  - name: judge-1
    provider: openai
    model: gpt-6-luna
  - name: judge-2
    provider: openai
    model: gpt-6-luna
  - name: judge-3
    provider: openai
    model: gpt-6-luna
