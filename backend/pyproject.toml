[project]
name = "datadoom-backend"
version = "0.1.0"
description = "Conversation quality analytics API and control runner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["."]
exclude = ["tests/", ".venv/"]

[tool.fastapi]
entrypoint = "backend.main:app"
